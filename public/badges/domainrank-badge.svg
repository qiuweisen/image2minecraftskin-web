<svg xmlns="http://www.w3.org/2000/svg" width="249" height="40" viewBox="0 0 249 40">
  <defs>
    <linearGradient id="drGradientSmall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@600;700&amp;display=swap');
      .label-text { font-family: 'Inter', system-ui, sans-serif; font-weight: 600; }
      .dr-value { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="249" height="40" rx="20" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
  
  <!-- Circular gauge -->
  <g transform="translate(20, 20)">
    <!-- Background circle -->
    <circle cx="0" cy="0" r="12" fill="none" stroke="#3f3f46" stroke-width="3" transform="rotate(-90)"/>
    <!-- Progress circle -->
    <circle cx="0" cy="0" r="12" fill="none" stroke="url(#drGradientSmall)" stroke-width="3" stroke-linecap="round" 
      stroke-dasharray="75.39822368615503" stroke-dashoffset="75.39822368615503" transform="rotate(-90)"/>
    <!-- DR Value -->
    <text x="0" y="4" text-anchor="middle" class="dr-value" font-size="10" fill="#ffffff">0</text>
  </g>
  
  <!-- Label -->
  <text x="45" y="24" class="label-text" font-size="11" fill="#ffffff" letter-spacing="0.03em">CERTIFIED DOMAIN RATING</text>
</svg>